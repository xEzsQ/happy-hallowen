<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte à Rebours - Joyeux Halloween</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        spooky: {
                            orange: '#ff6600',
                            purple: '#6b21a8',
                            darkPurple: '#1e0734',
                            night: '#07060a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        spooky: ['Creepster', 'cursive', 'serif']
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
                        'fog': 'fog 20s linear infinite'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-12px)' }
                        },
                        pulseGlow: {
                            '0%, 100%': { filter: 'drop-shadow(0 0 15px rgba(255,102,0,0.4))' },
                            '50%': { filter: 'drop-shadow(0 0 35px rgba(255,102,0,0.8))' }
                        },
                        fog: {
                            '0%': { transform: 'translateX(-50%)' },
                            '100%': { transform: 'translateX(0%)' }
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        .font-creepster {
            font-family: 'Creepster', cursive;
        }
        .evil-glow {
            filter: drop-shadow(0 0 25px #ff0000) drop-shadow(0 0 45px #ff6600) !important;
        }
    </style>
</head>
<body class="bg-spooky-night text-gray-200 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 overflow-x-hidden relative selection:bg-spooky-orange selection:text-black">

    <!-- Fog Background Overlay -->
    <div class="fixed inset-0 pointer-events-none z-0 opacity-25 overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_40%,rgba(107,33,168,0.35),transparent_70%)]"></div>
        <div class="w-[200%] h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-spooky-purple/30 via-transparent to-transparent animate-fog"></div>
    </div>

    <!-- Canvas pour effet de particules/poussière hantée & Confettis -->
    <canvas id="spookyCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- Contenu Principal Centré -->
    <main class="relative z-10 w-full max-w-4xl mx-auto my-auto flex flex-col items-center text-center py-8">
        
        <!-- Logo Tête de Mort Noire Stylisée (SVG Vectoriel) -->
        <div class="relative mb-8 animate-float">
            <!-- Halo lumineux derrière le logo -->
            <div id="skullHalo" class="absolute inset-0 rounded-full bg-gradient-to-r from-spooky-purple/40 to-spooky-orange/40 blur-2xl -z-10 scale-125 transition-all duration-700"></div>
            
            <div id="skullCard" class="w-36 h-36 sm:w-48 sm:h-48 md:w-56 md:h-56 bg-black rounded-full p-4 border-2 border-spooky-orange/40 shadow-[0_0_50px_rgba(107,33,168,0.5)] flex items-center justify-center animate-pulse-glow transition-all duration-500">
                <svg class="w-full h-full" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Contour & Ombre Portée de la Tête de Mort -->
                    <filter id="skullGlow">
                        <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff6600" flood-opacity="0.6"/>
                    </filter>
                    
                    <!-- Forme Principale du Crâne Noir -->
                    <path d="M100 20 C55 20 25 52 25 96 C25 125 40 144 58 155 L58 175 C58 180 62 184 67 184 L133 184 C138 184 142 180 142 175 L142 155 C160 144 175 125 175 96 C175 52 145 20 100 20 Z" 
                          fill="#0a0a0c" 
                          stroke="#ff6600" 
                          stroke-width="3.5" 
                          filter="url(#skullGlow)" />
                    
                    <!-- Pommettes & Détails Sculptés -->
                    <path d="M42 110 C35 90 45 60 70 50" stroke="#6b21a8" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M158 110 C165 90 155 60 130 50" stroke="#6b21a8" stroke-width="2.5" stroke-linecap="round"/>
                    
                    <!-- Orbites des Yeux Sombre/Gothiques -->
                    <path d="M52 85 C52 70 70 68 78 82 C85 96 68 112 56 106 C52 104 52 93 52 85 Z" fill="#000000" stroke="#ff6600" stroke-width="2"/>
                    <path d="M148 85 C148 70 130 68 122 82 C115 96 132 112 144 106 C148 104 148 93 148 85 Z" fill="#000000" stroke="#ff6600" stroke-width="2"/>
                    
                    <!-- Pupilles Lumineuses (Changeables au rouge à minuit) -->
                    <circle id="eyeLeft" cx="68" cy="88" r="4" fill="#ff6600" class="transition-all duration-500"/>
                    <circle id="eyeRight" cx="132" cy="88" r="4" fill="#ff6600" class="transition-all duration-500"/>
                    
                    <!-- Cavité Nasale -->
                    <path d="M100 110 L90 130 L100 126 L110 130 Z" fill="#000000" stroke="#ff6600" stroke-width="1.5"/>
                    
                    <!-- Mâchoire & Dents -->
                    <path d="M68 152 L132 152" stroke="#ff6600" stroke-width="2"/>
                    <path d="M76 145 L76 172" stroke="#ff6600" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M92 145 L92 172" stroke="#ff6600" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M108 145 L108 172" stroke="#ff6600" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M124 145 L124 172" stroke="#ff6600" stroke-width="2.5" stroke-linecap="round"/>

                    <!-- Fissures du Crâne Gothique -->
                    <path d="M100 20 L104 35 L96 48 L102 60" stroke="#6b21a8" stroke-width="1.5" fill="none"/>
                </svg>
            </div>
        </div>

        <!-- Titre Simplifié -->
        <h1 class="font-creepster text-5xl sm:text-7xl md:text-8xl text-transparent bg-clip-text bg-gradient-to-b from-orange-400 via-spooky-orange to-red-600 tracking-wider mb-10 drop-shadow-[0_5px_10px_rgba(0,0,0,0.9)]">
            Happy Halloween 🎃💀👻
        </h1>

        <!-- Compteur à Rebours -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-6 w-full max-w-3xl px-2">
            <!-- Jours -->
            <div class="bg-black/60 border border-spooky-purple/50 rounded-2xl p-4 sm:p-6 backdrop-blur-md shadow-2xl shadow-spooky-purple/20 hover:border-spooky-orange transition-all duration-300">
                <span id="days" class="font-creepster text-5xl sm:text-7xl text-orange-400 block drop-shadow-[0_0_10px_rgba(255,102,0,0.3)]">00</span>
                <span class="text-[10px] sm:text-xs uppercase tracking-[0.2em] text-gray-400 font-bold mt-1 block">Jours</span>
            </div>
            <!-- Heures -->
            <div class="bg-black/60 border border-spooky-purple/50 rounded-2xl p-4 sm:p-6 backdrop-blur-md shadow-2xl shadow-spooky-purple/20 hover:border-spooky-orange transition-all duration-300">
                <span id="hours" class="font-creepster text-5xl sm:text-7xl text-orange-400 block drop-shadow-[0_0_10px_rgba(255,102,0,0.3)]">00</span>
                <span class="text-[10px] sm:text-xs uppercase tracking-[0.2em] text-gray-400 font-bold mt-1 block">Heures</span>
            </div>
            <!-- Minutes -->
            <div class="bg-black/60 border border-spooky-purple/50 rounded-2xl p-4 sm:p-6 backdrop-blur-md shadow-2xl shadow-spooky-purple/20 hover:border-spooky-orange transition-all duration-300">
                <span id="minutes" class="font-creepster text-5xl sm:text-7xl text-orange-400 block drop-shadow-[0_0_10px_rgba(255,102,0,0.3)]">00</span>
                <span class="text-[10px] sm:text-xs uppercase tracking-[0.2em] text-gray-400 font-bold mt-1 block">Minutes</span>
            </div>
            <!-- Secondes -->
            <div class="bg-black/60 border border-spooky-purple/50 rounded-2xl p-4 sm:p-6 backdrop-blur-md shadow-2xl shadow-spooky-purple/20 hover:border-spooky-orange transition-all duration-300">
                <span id="seconds" class="font-creepster text-5xl sm:text-7xl text-spooky-orange block animate-pulse drop-shadow-[0_0_15px_rgba(255,102,0,0.5)]">00</span>
                <span class="text-[10px] sm:text-xs uppercase tracking-[0.2em] text-gray-400 font-bold mt-1 block">Secondes</span>
            </div>
        </div>
    </main>

    <!-- Modal / Overlay de la Surprise de Minuit -->
    <div id="surpriseModal" class="fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-1000 backdrop-blur-xl">
        <div class="text-center max-w-2xl transform scale-95 transition-transform duration-700" id="surpriseContent">
            <div class="text-6xl sm:text-8xl mb-4 animate-bounce">🎃 🦇 💀 👻</div>
            <h2 class="font-creepster text-6xl sm:text-8xl md:text-9xl text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-spooky-orange to-yellow-400 drop-shadow-[0_0_30px_rgba(255,102,0,0.8)] mb-4">
                SURPRISE DE MINUIT !
            </h2>
            <p class="font-creepster text-3xl sm:text-5xl text-purple-300 mb-6">
                Les portes des ténèbres sont ouvertes !
            </p>
            <p class="text-gray-300 text-sm sm:text-lg mb-8 max-w-md mx-auto">
                Que les esprits bienveillants et les créatures de la nuit célèbrent avec toi cette heure magique.
            </p>
            <button onclick="closeSurprise()" class="font-bold text-lg bg-gradient-to-r from-spooky-orange to-red-600 hover:from-orange-500 hover:to-red-500 text-black px-8 py-4 rounded-full shadow-[0_0_30px_rgba(255,102,0,0.6)] transform hover:scale-105 transition-all duration-300 cursor-pointer">
                Rejoindre la fête ! 🎉
            </button>
        </div>
    </div>

    <!-- Pied de Page -->
    <footer class="relative z-10 pb-4 text-center text-xs text-gray-600">
        Rendez-vous le 31 Octobre à Minuit
    </footer>

    <!-- Logic Script -->
    <script>
        // Audio Synthesizer via Web Audio API (pas de fichiers externes requis)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSpookySound() {
            if (!audioCtx) audioCtx = new AudioContext();
            
            // Son d'ambiance d'Halloween (Balayage mystique + Rire d'orgue)
            const now = audioCtx.currentTime;
            
            // Oscillateur principal pour l'effet de sirène/fantôme
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.8);
            osc.frequency.exponentialRampToValueAtTime(100, now + 2.5);

            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.3, now + 0.5);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 2.8);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 3);

            // Bruit de rire/carillon diabolique
            setTimeout(() => {
                for (let i = 0; i < 5; i++) {
                    const laughOsc = audioCtx.createOscillator();
                    const laughGain = audioCtx.createGain();
                    laughOsc.type = 'triangle';
                    laughOsc.frequency.setValueAtTime(220 - (i * 20), audioCtx.currentTime + (i * 0.15));
                    
                    laughGain.gain.setValueAtTime(0.2, audioCtx.currentTime + (i * 0.15));
                    laughGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (i * 0.15) + 0.2);

                    laughOsc.connect(laughGain);
                    laughGain.connect(audioCtx.destination);

                    laughOsc.start(audioCtx.currentTime + (i * 0.15));
                    laughOsc.stop(audioCtx.currentTime + (i * 0.15) + 0.25);
                }
            }, 500);
        }

        // Animation des particules/poussière hantée & Confettis d'Halloween
        const canvas = document.getElementById('spookyCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let confettis = [];
        let isSurpriseActive = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.speedY = Math.random() * -0.8 - 0.2;
                this.opacity = Math.random() * 0.6 + 0.1;
                this.color = Math.random() > 0.5 ? '#ff6600' : '#a855f7';
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
                    this.reset();
                    this.y = canvas.height;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Confettis avec symboles d'Halloween (🎃, 🦇, 💀, 👻, ✨)
        class HalloweenConfetti {
            constructor() {
                const symbols = ['🎃', '🦇', '💀', '👻', '✨', '🕷️', '🍬'];
                this.symbol = symbols[Math.floor(Math.random() * symbols.length)];
                this.x = canvas.width / 2 + (Math.random() * 200 - 100);
                this.y = canvas.height / 2;
                this.size = Math.random() * 24 + 16;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 12 + 6;
                this.speedX = Math.cos(angle) * speed;
                this.speedY = Math.sin(angle) * speed - 4;
                this.gravity = 0.2;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 10 - 5;
                this.opacity = 1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += this.gravity;
                this.rotation += this.rotationSpeed;
                this.opacity -= 0.008;
            }

            draw() {
                if (this.opacity <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.font = `${this.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.symbol, 0, 0);
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 55; i++) {
                particles.push(new Particle());
            }
        }

        function spawnConfettiExplosion() {
            for (let i = 0; i < 120; i++) {
                confettis.push(new HalloweenConfetti());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Gérer les confettis d'Halloween
            for (let i = confettis.length - 1; i >= 0; i--) {
                confettis[i].update();
                confettis[i].draw();
                if (confettis[i].opacity <= 0) {
                    confettis.splice(i, 1);
                }
            }

            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        // Fonction Surprise de Minuit
        let hasTriggeredSurprise = false;

        function triggerSurprise() {
            playSpookySound();
            spawnConfettiExplosion();

            // Deuxième vague de confettis
            setTimeout(spawnConfettiExplosion, 600);

            // Transformation du logo Tête de Mort
            const skullCard = document.getElementById('skullCard');
            const skullHalo = document.getElementById('skullHalo');
            const eyeLeft = document.getElementById('eyeLeft');
            const eyeRight = document.getElementById('eyeRight');

            skullCard.classList.add('evil-glow');
            skullHalo.className = 'absolute inset-0 rounded-full bg-gradient-to-r from-red-600 to-spooky-orange blur-3xl -z-10 scale-150 transition-all duration-700';
            eyeLeft.setAttribute('fill', '#ff0000');
            eyeRight.setAttribute('fill', '#ff0000');
            eyeLeft.setAttribute('r', '6');
            eyeRight.setAttribute('r', '6');

            // Afficher le modal de surprise
            const modal = document.getElementById('surpriseModal');
            const content = document.getElementById('surpriseContent');
            
            modal.classList.remove('pointer-events-none');
            modal.classList.remove('opacity-0');
            modal.classList.add('opacity-100');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closeSurprise() {
            const modal = document.getElementById('surpriseModal');
            const content = document.getElementById('surpriseContent');

            modal.classList.add('opacity-0');
            modal.classList.add('pointer-events-none');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');

            // Réinitialisation partielle du logo
            setTimeout(() => {
                const skullCard = document.getElementById('skullCard');
                skullCard.classList.remove('evil-glow');
            }, 1000);
        }

        // Calcul du Compte à Rebours d'Halloween (31 Octobre Minuit)
        function updateCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            let halloweenDate = new Date(`October 31, ${currentYear} 23:59:59`);

            // Si le 31 octobre de cette année est passé, viser l'année suivante
            if (now > halloweenDate) {
                halloweenDate = new Date(`October 31, ${currentYear + 1} 23:59:59`);
            }

            const diff = halloweenDate - now;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');

            // Déclencher la surprise automatiquement à minuit pile !
            if (diff <= 1000 && !hasTriggeredSurprise) {
                hasTriggeredSurprise = true;
                triggerSurprise();
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
